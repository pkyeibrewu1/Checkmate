<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckMate – Exit Verification Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-table { background: #1e293b; border: 2px solid #334155; border-radius: 12px; }
        .card-table:hover { border-color: #38bdf8; }
        .table-title { color: #f1f5f9; font-weight: 700; font-size: 1.25rem; }
        .order-total-text { color: #cbd5e1; font-weight: 600; }
        .status-available { color: #4ade80; font-weight: bold; }
        .status-occupied { color: #f87171; font-weight: bold; }
        .status-paid { color: #fbbf24; font-weight: bold; }
        .gate-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; }

        /* Printable Ticket Styling for both Kitchen & Customer Exit Receipt */
        @media print {
            body * { visibility: hidden; }
            #printable-ticket, #printable-ticket * { visibility: visible; }
            #printable-ticket { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; padding: 20px; }
        }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <h1 class="fw-bold text-info">🛡️ CheckMate Dashboard</h1>
            <span class="badge bg-primary fs-6">Live Restaurant State</span>
        </header>

        <div class="row g-4">
            <div class="col-lg-8">
                <h3 class="mb-3 text-white">Table Floor Map</h3>
                <div id="table-grid" class="row g-3">
                    </div>
            </div>

            <div class="col-lg-4">
                <div class="gate-card p-4 mb-4">
                    <h4 class="text-info mb-3">🚪 Exit Security Verification Gate</h4>
                    <p class="text-slate-300 small">Enter Receipt ID presented by customer at venue exit:</p>
                    <div class="input-group mb-3">
                        <input type="text" id="receipt-input" class="form-control" placeholder="e.g. CM-1000">
                        <button class="btn btn-info fw-bold" onclick="verifyExit()">Verify Exit</button>
                    </div>
                    <div id="gate-result" class="alert d-none"></div>
                </div>

                <div class="card bg-dark text-white p-3 border-secondary">
                    <h5 class="text-info">📋 Menu Catalog Overview</h5>
                    <ul id="menu-list" class="list-group list-group-flush mt-2">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="receiptModal" tabindex="-1" aria-labelledby="receiptModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-info">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-info" id="receiptModalLabel">🧾 Customer Exit Pass & Receipt</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center" id="receiptModalBody">
                    </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-info fw-bold" onclick="printCurrentCustomerReceipt()">🖨️ Print Customer Pass</button>
                </div>
            </div>
        </div>
    </div>

    <div id="printable-ticket" class="d-none"></div>

    <script>
        const API_BASE = '/api';
        let globalMenu = [];
        let currentReceiptHTML = '';

        async function init() {
            await loadMenuCatalog();
            await loadDashboard();
        }

        async function loadMenuCatalog() {
            try {
                const res = await fetch(`${API_BASE}/menu`);
                globalMenu = await res.json();
                const menuList = document.getElementById('menu-list');
                menuList.innerHTML = '';
                globalMenu.forEach(item => {
                    menuList.innerHTML += `
                        <li class="list-group-item bg-dark text-white d-flex justify-content-between align-items-center border-secondary px-0">
                            <span>#${item.id} - ${item.name}</span>
                            <span class="badge bg-secondary">$${item.price.toFixed(2)}</span>
                        </li>
                    `;
                });
            } catch(e) {
                console.error("Failed loading menu catalog", e);
            }
        }

        async function loadDashboard() {
            const res = await fetch(`${API_BASE}/tables`);
            const tables = await res.json();
            const grid = document.getElementById('table-grid');
            grid.innerHTML = '';

            tables.forEach(table => {
                let statusText = 'Available';
                let statusClass = 'status-available';
                let actionBtn = `<button class="btn btn-sm btn-outline-success w-100 mt-2" onclick="seatTable(${table.tableNumber})">Seat Customer</button>`;

                if (table.occupied) {
                    const isPaid = table.currentOrder && table.currentOrder.status === 'PAID';
                    statusText = isPaid ? 'Paid (Pending Exit)' : 'Occupied';
                    statusClass = isPaid ? 'status-paid' : 'status-occupied';
                    
                    let menuOptions = globalMenu.map(item => 
                        `<option value="${item.id}">${item.name} ($${item.price.toFixed(2)})</option>`
                    ).join('');

                    actionBtn = `
                        <div class="mt-2">
                            <div class="input-group input-group-sm mb-2">
                                <select id="select-item-${table.tableNumber}" class="form-select bg-dark text-white border-secondary">
                                    ${menuOptions}
                                </select>
                                <button class="btn btn-outline-warning" onclick="addItemToTable(${table.tableNumber})">+ Add</button>
                            </div>
                            <div class="btn-group w-100 mb-1">
                                <button class="btn btn-sm btn-outline-light" onclick="printKitchenTicket(${table.tableNumber})">🖨️ Kitchen</button>
                                <button class="btn btn-sm btn-outline-info" onclick="payBill(${table.tableNumber})">Pay Bill</button>
                            </div>
                            <button class="btn btn-sm btn-outline-danger w-100" onclick="clearTable(${table.tableNumber})">Clear</button>
                        </div>
                    `;
                }

                let total = 0;
                let itemCount = 0;
                if (table.currentOrder && table.currentOrder.items) {
                    total = table.currentOrder.items.reduce((sum, item) => sum + item.price, 0);
                    itemCount = table.currentOrder.items.length;
                }

                grid.innerHTML += `
                    <div class="col-md-4">
                        <div class="card card-table p-3 text-center">
                            <div class="table-title">Table ${table.tableNumber}</div>
                            <span class="${statusClass} my-1">${statusText}</span>
                            <div class="order-total-text small mb-1">
                                ${table.occupied ? `Items: ${itemCount} | Order Total: $${total.toFixed(2)}` : 'No active order'}
                            </div>
                            ${actionBtn}
                        </div>
                    </div>
                `;
            });
        }

        async function seatTable(num) {
            await fetch(`${API_BASE}/seat/${num}`, { method: 'POST' });
            loadDashboard();
        }

        async function addItemToTable(num) {
            const itemId = document.getElementById(`select-item-${num}`).value;
            await fetch(`${API_BASE}/order/add?tableNumber=${num}&itemId=${itemId}`, { method: 'POST' });
            loadDashboard();
        }

        async function printKitchenTicket(tableNumber) {
            const res = await fetch(`${API_BASE}/tables`);
            const tables = await res.json();
            const table = tables.find(t => t.tableNumber === tableNumber);

            if (!table || !table.currentOrder || !table.currentOrder.items.length) {
                alert("No active items to print for Kitchen!");
                return;
            }

            const items = table.currentOrder.items;
            let itemListHTML = items.map(i => `<li><strong>${i.name}</strong></li>`).join('');

            const ticketDiv = document.getElementById('printable-ticket');
            ticketDiv.innerHTML = `
                <h2>--- KITCHEN ORDER TICKET ---</h2>
                <p><strong>Table #:</strong> ${tableNumber}</p>
                <p><strong>Order ID:</strong> #${table.currentOrder.orderId}</p>
                <p><strong>Time:</strong> ${new Date().toLocaleTimeString()}</p>
                <hr/>
                <h3>Items to Prepare:</h3>
                <ul>${itemListHTML}</ul>
                <hr/>
            `;

            ticketDiv.classList.remove('d-none');
            window.print();
            ticketDiv.classList.add('d-none');
        }

        async function payBill(num) {
            const res = await fetch(`${API_BASE}/pay/${num}`, { method: 'POST' });
            const data = await res.json();

            if (data.success) {
                // Generate Customer Exit Pass HTML
                currentReceiptHTML = `
                    <div class="border border-info rounded p-3 text-center">
                        <h3 class="text-info fw-bold mb-1">CheckMate Bistro Pass</h3>
                        <p class="text-muted small mb-2">Show this code at the exit gate</p>
                        <hr class="border-secondary"/>
                        <h1 class="display-6 fw-bold text-warning mb-2">${data.receiptId}</h1>
                        <p class="mb-1"><strong>Table Number:</strong> ${num}</p>
                        <p class="mb-1"><strong>Total Paid:</strong> $${data.amount.toFixed(2)}</p>
                        <p class="small text-muted mb-0">Status: PAID (Single-Use Exit Clear)</p>
                    </div>
                `;

                document.getElementById('receiptModalBody').innerHTML = currentReceiptHTML;
                const modal = new bootstrap.Modal(document.getElementById('receiptModal'));
                modal.show();
            } else {
                alert(data.message || 'Payment failed');
            }
            loadDashboard();
        }

        function printCurrentCustomerReceipt() {
            if (!currentReceiptHTML) return;
            const ticketDiv = document.getElementById('printable-ticket');
            ticketDiv.innerHTML = currentReceiptHTML;
            ticketDiv.classList.remove('d-none');
            window.print();
            ticketDiv.classList.add('d-none');
        }

        async function verifyExit() {
            const id = document.getElementById('receipt-input').value.trim();
            if (!id) return;

            const res = await fetch(`${API_BASE}/verify?receiptId=${id}`, { method: 'POST' });
            const data = await res.json();
            const resultDiv = document.getElementById('gate-result');
            resultDiv.classList.remove('d-none', 'alert-success', 'alert-danger');

            if (data.approved) {
                resultDiv.classList.add('alert-success');
                resultDiv.innerText = '✅ APPROVED: Valid receipt. Exit allowed and table automatically cleared!';
                document.getElementById('receipt-input').value = '';
            } else {
                resultDiv.classList.add('alert-danger');
                resultDiv.innerText = '❌ DENIED: Invalid, unpaid, or already verified receipt!';
            }
            
            loadDashboard();
        }

        async function clearTable(num) {
            await fetch(`${API_BASE}/clear/${num}`, { method: 'POST' });
            loadDashboard();
        }

        init();
    </script>
</body>
</html>
